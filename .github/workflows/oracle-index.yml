name: Oracle Index

on:
  push:
    branches: [main]
    paths:
      - "*/transcript.*"
      - "*/data.json"
      - "data.json"
      - "oracle/index.py"
      - "oracle/fusion.py"

jobs:
  reindex:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build index
        run: cd oracle && python index.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add oracle/docfreq.json oracle/symbols.json
          git diff --cached --quiet || (git commit -m "chore: rebuild oracle index" && git push)
